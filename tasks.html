<!DOCTYPE html>
<!-- ============================================================
     FocusBoard — Tasks Page (tasks.html)
  Author: Harshit
     Responsibility: Filter bar, task card list (pending +
                     completed), Add Task form UI
     ============================================================ -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusBoard — Tasks</title>
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
  <style>
    /* -- Harshit: Two-column page layout (list | form) -- */
    .tasks-layout { display: grid; grid-template-columns: 1fr 300px; gap: 24px; }

    /* Row of filter buttons at the top */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap; /* wraps to next line on small screens */
    }

    /* Each filter button (pill shape) */
    .filter-btn {
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition);
    }

    /* Active or hovered filter button turns blue */
    .filter-btn:hover,
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* One task card row */
    .task-card {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 18px 20px;
      margin-bottom: 10px;
      transition: box-shadow var(--transition), transform var(--transition);
    }

    /* Task card lifts on hover */
    .task-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    /* Round checkbox on the left of each task */
    .task-card-check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* Blue filled = task is done */
    .task-card-check.done {
      background: var(--accent);
      border-color: var(--accent);
    }

    .task-card-body { flex: 1; }

    /* Task title text */
    .task-card-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    /* Strikethrough grey text for completed tasks */
    .task-card-title.done {
      color: var(--text-light);
      text-decoration: line-through;
    }

    /* Row of small info below the title: subject, date, status */
    .task-card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .task-card-meta span { font-size: 12px; color: var(--text-muted); }

    /* The dot separator between meta items */
    .meta-dot { color: var(--border) !important; }

    /* Add Task form card on the right */
    .form-card {
      padding: 24px;
      align-self: start; /* sticks to the top */
    }

    .form-title { font-size: 15px; font-weight: 700; margin-bottom: 18px; }

    /* Spacing between each form field */
    .form-group { margin-bottom: 14px; }

    /* Label above each input */
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* Text inputs, dropdowns, and textarea */
    .form-input,
    .form-select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color var(--transition);
    }

    /* Blue border when the field is focused/clicked */
    .form-input:focus,
    .form-select:focus {
      border-color: var(--accent);
    }

    .form-input::placeholder { color: var(--text-light); }

    /* On tablet/mobile: form goes below the task list */
    @media (max-width: 900px) {
      .tasks-layout { grid-template-columns: 1fr; }
    }

  </style>
</head>
<body data-page="tasks">

<div class="app-layout">

  <!-- Left sidebar navigation -->
  <aside class="sidebar">
    <div class="logo">⚡ FocusBoard</div>
    <nav>
      <a href="dashboard.html" class="nav-link">
        <span class="nav-icon">📊</span><span>Dashboard</span>
      </a>
      <a href="tasks.html" class="nav-link active">
        <span class="nav-icon">✅</span><span>Tasks</span>
      </a>
      <a href="deadlines.html" class="nav-link">
        <span class="nav-icon">📅</span><span>Deadlines</span>
      </a>
      <a href="focus.html" class="nav-link">
        <span class="nav-icon">🎯</span><span>Focus Mode</span>
      </a>
    </nav>
  </aside>

  <main class="main-content">

    <!-- Page title with task count summary -->
    <div class="page-header">
      <h1>Tasks</h1>
      <p><span id="task-total">8</span> tasks total · <span id="task-completed">3</span> completed · <span id="task-remaining">5</span> remaining</p>
    </div>

    <!-- Filter buttons to show different task groups -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
      <button class="filter-btn" data-filter="due-today">Due Today</button>
      <button class="filter-btn" data-filter="subject:Mathematics">Mathematics</button>
      <button class="filter-btn" data-filter="subject:Physics">Physics</button>
      <button class="filter-btn" data-filter="subject:English">English</button>
    </div>

    <div class="tasks-layout">

      <!-- Left: task list -->
      <div>

        <div class="task-section" data-section="pending">
          <div class="section-title">Pending</div>
          <div class="task-section-list" id="pending-list"></div>
        </div>

        <div class="task-section" data-section="completed">
          <div class="section-title" style="margin-top:28px;">Completed</div>
          <div class="task-section-list" id="completed-list"></div>
        </div>

        <div id="task-empty" class="empty-state" style="display:none;">No tasks match this filter.</div>
      </div>

      <!-- Right: Add New Task form -->
      <form class="card form-card" id="task-form">
        <div class="form-title">+ Add New Task</div>

        <!-- Task name field -->
        <div class="form-group">
          <label class="form-label" for="task-title">Task Title</label>
          <input class="form-input" id="task-title" name="title" type="text" placeholder="e.g. Read Chapter 6" required />
        </div>

        <!-- Subject picker -->
        <div class="form-group">
          <label class="form-label" for="task-subject">Subject</label>
          <select class="form-select" id="task-subject" name="subject">
            <option>Mathematics</option>
            <option>Physics</option>
            <option>English</option>
            <option>Biology</option>
            <option>History</option>
          </select>
        </div>

        <!-- Deadline date picker -->
        <div class="form-group">
          <label class="form-label" for="task-deadline">Deadline</label>
          <input class="form-input" id="task-deadline" name="deadline" type="date" />
        </div>

        <!-- Priority level picker -->
        <div class="form-group">
          <label class="form-label" for="task-priority">Priority</label>
          <select class="form-select" id="task-priority" name="priority">
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
          </select>
        </div>

        <!-- Optional notes box -->
        <div class="form-group" style="margin-bottom:20px;">
          <label class="form-label" for="task-notes">Notes</label>
          <textarea class="form-input" id="task-notes" name="notes" rows="3" placeholder="Optional notes..." style="resize:vertical"></textarea>
        </div>

        <!-- Submit button -->
        <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center;">Add Task</button>
      </form>

    </div>
  </main>
</div>

</body>
</html>
