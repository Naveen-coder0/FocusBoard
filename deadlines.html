<!DOCTYPE html>
<!--
  FocusBoard - Deadlines Page
  Author: Naveen Maan
  This page shows a calendar for July 2025.
  Dates with deadlines have colored dots.
  The right panel lists all upcoming deadlines.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusBoard — Deadlines</title>
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
  <style>

    /* Two columns: calendar on left, deadline list on right */
    .deadlines-layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 24px;
    }

    /* Extra padding inside the calendar card */
    .calendar-card { padding: 24px; }

    /* Top row of the calendar: month name + arrow buttons */
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .cal-header h2 { font-size: 18px; font-weight: 700; }

    /* Wrapper for the two arrow buttons */
    .cal-nav { display: flex; gap: 8px; }

    /* Each arrow button (prev/next month) */
    .cal-nav-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all var(--transition);
    }

    .cal-nav-btn:hover {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Row of weekday names: Sun Mon Tue ... */
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 8px;
    }

    .cal-weekday {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 6px 0;
    }

    /* The main calendar grid: 7 columns, one per day of week */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    /* Each day cell in the calendar */
    .cal-day {
      aspect-ratio: 1; /* keeps cells square */
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 6px 4px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: default;
      transition: background var(--transition);
      min-height: 52px;
    }

    .cal-day:hover { background: var(--bg); }

    /* Days from the previous or next month are very light */
    .cal-day.other-month { color: var(--border); }

    /* Today's date gets a blue background */
    .cal-day.today {
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    .cal-day.today:hover { background: var(--accent-dark); }

    /* Days with a deadline get a light grey background */
    .cal-day.has-deadline { background: var(--bg); }

    /* The day number inside each cell */
    .cal-day-num { line-height: 1; margin-bottom: 4px; }

    /* Row of colored dots below the day number */
    .cal-dots {
      display: flex;
      gap: 2px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* One colored dot */
    .cal-dot { width: 6px; height: 6px; border-radius: 50%; }

    /* Each subject has its own dot color */
    .dot-math    { background: #4f7ef8; } /* blue */
    .dot-physics { background: #7c3aed; } /* purple */
    .dot-english { background: #be185d; } /* pink */
    .dot-history { background: #f59e0b; } /* amber */
    .dot-biology { background: #22c55e; } /* green */

    /* Color legend below the calendar */
    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Larger dot used in the legend */
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

    /* Right panel: list of upcoming deadlines */
    .deadline-list-card {
      padding: 24px;
      align-self: start; /* sticks to the top */
    }

    /* One deadline row */
    .dl-item {
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .dl-item:last-child { border-bottom: none; padding-bottom: 0; }

    /* Top row of each deadline: title on left, badge on right */
    .dl-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .dl-title { font-size: 14px; font-weight: 600; }

    .dl-date { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* Progress bar below each deadline */
    .dl-bar-wrap { margin-top: 8px; }

    /* On tablet/mobile: stack calendar and list into one column */
    @media (max-width: 900px) {
      .deadlines-layout { grid-template-columns: 1fr; }
    }

  </style>
</head>
<body data-page="deadlines">

<div class="app-layout">

  <!-- Left sidebar navigation -->
  <aside class="sidebar">
    <div class="logo">⚡ FocusBoard</div>
    <nav>
      <a href="dashboard.html" class="nav-link">
        <span class="nav-icon">📊</span><span>Dashboard</span>
      </a>
      <a href="tasks.html" class="nav-link">
        <span class="nav-icon">✅</span><span>Tasks</span>
      </a>
      <a href="deadlines.html" class="nav-link active">
        <span class="nav-icon">📅</span><span>Deadlines</span>
      </a>
      <a href="focus.html" class="nav-link">
        <span class="nav-icon">🎯</span><span>Focus Mode</span>
      </a>
    </nav>
  </aside>

  <main class="main-content">

    <!-- Page title -->
    <div class="page-header">
      <h1>Deadlines</h1>
      <p id="deadlines-count">5 upcoming deadlines this month</p>
    </div>

    <div class="deadlines-layout">

      <!-- Calendar card -->
      <div class="card calendar-card">

        <!-- Month name and navigation arrows -->
        <div class="cal-header">
          <h2 id="cal-month">July 2025</h2>
          <div class="cal-nav">
            <button class="cal-nav-btn" data-cal-nav="prev">‹</button>
            <button class="cal-nav-btn" data-cal-nav="next">›</button>
          </div>
        </div>

        <!-- Weekday column headers -->
        <div class="cal-weekdays">
          <div class="cal-weekday">Sun</div>
          <div class="cal-weekday">Mon</div>
          <div class="cal-weekday">Tue</div>
          <div class="cal-weekday">Wed</div>
          <div class="cal-weekday">Thu</div>
          <div class="cal-weekday">Fri</div>
          <div class="cal-weekday">Sat</div>
        </div>

        <!-- All day cells for July 2025 -->
        <div class="cal-grid" id="cal-grid"></div>

        <!-- Color legend: which color = which subject -->
        <div class="legend">
          <div class="legend-item"><div class="legend-dot dot-math"></div> Mathematics</div>
          <div class="legend-item"><div class="legend-dot dot-physics"></div> Physics</div>
          <div class="legend-item"><div class="legend-dot dot-english"></div> English</div>
          <div class="legend-item"><div class="legend-dot dot-history"></div> History</div>
          <div class="legend-item"><div class="legend-dot dot-biology"></div> Biology</div>
        </div>

      </div>

      <!-- Right panel: upcoming deadlines list -->
      <div class="card deadline-list-card">
        <div class="section-title">Upcoming</div>
        <div id="upcoming-list"></div>
        <div id="deadlines-empty" class="empty-state" style="display:none;">No upcoming deadlines.</div>
      </div>

    </div>
  </main>
</div>

</body>
</html>
